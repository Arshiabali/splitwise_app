<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SplitEase — Student Expense Splitter</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: #2a2a3d;
      --accent: #7c6af7;
      --accent2: #f7c66a;
      --accent3: #6af7b8;
      --danger: #f76a6a;
      --text: #f0f0f8;
      --muted: #8888aa;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 70%);
      animation: drift1 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(247,198,106,0.08) 0%, transparent 70%);
      animation: drift2 10s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(60px, 40px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-40px, -60px); } }

    .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }

    /* Header */
    header { text-align: center; margin-bottom: 48px; }
    .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 0 24px rgba(124,106,247,0.4);
    }
    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--text) 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--muted); font-size: 1rem; margin-top: 6px; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      transition: border-color 0.3s;
    }
    .card:hover { border-color: rgba(124,106,247,0.3); }
    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    /* Friends */
    .friends-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .friend-chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 14px 6px 6px;
      font-size: 0.88rem;
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .friend-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700;
      flex-shrink: 0;
    }
    .friend-chip .del-btn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; padding: 0; font-size: 0.9rem; line-height: 1;
      transition: color 0.2s;
    }
    .friend-chip .del-btn:hover { color: var(--danger); }

    .input-row { display: flex; gap: 10px; }
    input[type="text"], input[type="number"], select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.92rem;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,106,247,0.15);
    }
    input[type="text"] { flex: 1; }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9b8ff9);
      color: white;
      box-shadow: 0 4px 16px rgba(124,106,247,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,106,247,0.45); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* Expense form */
    .expense-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; }
    .split-among { margin-bottom: 14px; }
    .split-among label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 8px; font-weight: 500; }
    .checkbox-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 5px 12px;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .check-chip.selected {
      background: rgba(124,106,247,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }
    .check-chip input { display: none; }

    /* Expenses list */
    .expense-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .expense-item:last-child { border-bottom: none; }
    .exp-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .exp-info { flex: 1; }
    .exp-name { font-weight: 500; font-size: 0.95rem; }
    .exp-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .exp-amount { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--accent2); }
    .exp-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 4px 8px; border-radius: 6px; transition: all 0.2s; }
    .exp-del:hover { color: var(--danger); background: rgba(247,106,106,0.1); }

    /* Summary */
    .summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
    .stat-box {
      background: var(--surface2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .stat-box .val { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; }
    .stat-box .lbl { font-size: 0.72rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

    /* Settlement */
    .settlement-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: var(--surface2);
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .s-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; flex-shrink: 0;
    }
    .s-arrow { color: var(--muted); font-size: 1.2rem; }
    .s-amount {
      margin-left: auto;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent3);
    }
    .s-text { font-size: 0.9rem; }
    .s-text span { color: var(--accent2); font-weight: 600; }

    .empty { text-align: center; color: var(--muted); padding: 32px; font-size: 0.9rem; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

    .tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .tab {
      flex: 1; padding: 9px; border: none; background: none;
      color: var(--muted); cursor: pointer; border-radius: 9px;
      font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.82rem;
      letter-spacing: 0.5px; transition: all 0.2s;
    }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

    .section { display: none; }
    .section.active { display: block; }

    /* Balance bars */
    .balance-item { margin-bottom: 14px; }
    .balance-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.88rem; }
    .balance-bar-bg { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
    .balance-bar-fill { height: 100%; border-radius: 99px; transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1); }

    /* Category icons */
    .cat-food { background: rgba(247,198,106,0.15); }
    .cat-travel { background: rgba(106,247,184,0.15); }
    .cat-stay { background: rgba(124,106,247,0.15); }
    .cat-fun { background: rgba(247,106,106,0.15); }
    .cat-other { background: rgba(136,136,170,0.15); }

    @media (max-width: 600px) {
      .expense-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">
      <div class="logo-icon">💸</div>
    </div>
    <h1>SplitEase</h1>
    <p>Split expenses with friends — no awkward math, no drama.</p>
  </header>

  <!-- Step 1: Friends -->
  <div class="card">
    <div class="card-title">① Add Friends</div>
    <div class="friends-row" id="friendsRow">
      <div class="empty" style="padding:8px; font-size:0.85rem;">No friends added yet.</div>
    </div>
    <div class="input-row">
      <input type="text" id="friendInput" placeholder="Friend's name..." maxlength="20"/>
      <button class="btn btn-primary" onclick="addFriend()">+ Add</button>
    </div>
  </div>

  <!-- Step 2: Add Expense -->
  <div class="card">
    <div class="card-title">② Add Expense</div>
    <div class="expense-grid">
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="expDesc" placeholder="e.g. Dinner at Dhaba"/>
      </div>
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="expAmount" placeholder="0" min="1"/>
      </div>
      <div class="form-group">
        <label>Paid by</label>
        <select id="expPaidBy"><option value="">Select friend...</option></select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="expCat">
          <option value="food">🍔 Food</option>
          <option value="travel">🚌 Travel</option>
          <option value="stay">🏠 Stay</option>
          <option value="fun">🎉 Entertainment</option>
          <option value="other">📦 Other</option>
        </select>
      </div>
    </div>
    <div class="split-among">
      <label>Split among</label>
      <div class="checkbox-grid" id="splitAmong"></div>
    </div>
    <button class="btn btn-primary" onclick="addExpense()">+ Add Expense</button>
  </div>

  <!-- Results -->
  <div class="card">
    <div class="card-title">③ Results</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('expenses')">Expenses</button>
      <button class="tab" onclick="switchTab('balances')">Balances</button>
      <button class="tab" onclick="switchTab('settle')">Settle Up</button>
    </div>

    <!-- Expenses Tab -->
    <div class="section active" id="tab-expenses">
      <div class="summary-grid">
        <div class="stat-box">
          <div class="val" id="statTotal" style="color:var(--accent2)">₹0</div>
          <div class="lbl">Total Spent</div>
        </div>
        <div class="stat-box">
          <div class="val" id="statCount" style="color:var(--accent)">0</div>
          <div class="lbl">Expenses</div>
        </div>
        <div class="stat-box">
          <div class="val" id="statPer" style="color:var(--accent3)">₹0</div>
          <div class="lbl">Per Person</div>
        </div>
      </div>
      <div id="expensesList"><div class="empty"><div class="empty-icon">🧾</div>No expenses yet!</div></div>
    </div>

    <!-- Balances Tab -->
    <div class="section" id="tab-balances">
      <div id="balancesList"><div class="empty"><div class="empty-icon">⚖️</div>Add expenses to see balances.</div></div>
    </div>

    <!-- Settle Tab -->
    <div class="section" id="tab-settle">
      <div id="settleList"><div class="empty"><div class="empty-icon">✅</div>No settlements needed yet!</div></div>
    </div>
  </div>

  <div style="text-align:center; margin-top:12px;">
    <button class="btn btn-secondary" onclick="resetAll()">🗑️ Reset Everything</button>
  </div>

</div>

<script>
  // ── State ────────────────────────────────────────────────
  let friends = [];
  let expenses = [];

  const COLORS = [
    ['#7c6af7','#1a1730'], ['#f7c66a','#2a2010'], ['#6af7b8','#102a1e'],
    ['#f76a6a','#2a1010'], ['#6ab8f7','#101e2a'], ['#f76af0','#2a1029'],
    ['#aaf76a','#1a2910'], ['#f7a06a','#2a1a10']
  ];

  const CAT_ICONS = { food:'🍔', travel:'🚌', stay:'🏠', fun:'🎉', other:'📦' };
  const CAT_CLASS = { food:'cat-food', travel:'cat-travel', stay:'cat-stay', fun:'cat-fun', other:'cat-other' };

  function getColor(i) { return COLORS[i % COLORS.length]; }

  // ── Friends ────────────────────────────────────────────────
  function addFriend() {
    const input = document.getElementById('friendInput');
    const name = input.value.trim();
    if (!name) return;
    if (friends.find(f => f.toLowerCase() === name.toLowerCase())) {
      alert('Friend already added!'); return;
    }
    friends.push(name);
    input.value = '';
    renderFriends();
    updateSelects();
  }

  document.getElementById('friendInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addFriend();
  });

  function removeFriend(name) {
    friends = friends.filter(f => f !== name);
    renderFriends();
    updateSelects();
  }

  function renderFriends() {
    const row = document.getElementById('friendsRow');
    if (!friends.length) {
      row.innerHTML = '<div class="empty" style="padding:8px;font-size:0.85rem;">No friends added yet.</div>';
      return;
    }
    row.innerHTML = friends.map((f, i) => {
      const [bg, text] = getColor(i);
      return `<div class="friend-chip">
        <div class="friend-avatar" style="background:${bg};color:${bg === '#7c6af7' ? '#fff' : bg}">${f[0].toUpperCase()}</div>
        ${f}
        <button class="del-btn" onclick="removeFriend('${f}')">✕</button>
      </div>`;
    }).join('');
  }

  function updateSelects() {
    const paidBy = document.getElementById('expPaidBy');
    paidBy.innerHTML = '<option value="">Select friend...</option>' +
      friends.map(f => `<option value="${f}">${f}</option>`).join('');

    const splitDiv = document.getElementById('splitAmong');
    if (!friends.length) { splitDiv.innerHTML = ''; return; }
    splitDiv.innerHTML = friends.map((f, i) => {
      const [bg] = getColor(i);
      return `<label class="check-chip selected" onclick="toggleChip(this)">
        <input type="checkbox" value="${f}" checked/>
        <span style="color:${bg};font-weight:700">${f[0]}</span> ${f}
      </label>`;
    }).join('');
  }

  function toggleChip(el) {
    el.classList.toggle('selected');
    el.querySelector('input').checked = el.classList.contains('selected');
  }

  // ── Expenses ────────────────────────────────────────────────
  function addExpense() {
    const desc   = document.getElementById('expDesc').value.trim();
    const amount = parseFloat(document.getElementById('expAmount').value);
    const paidBy = document.getElementById('expPaidBy').value;
    const cat    = document.getElementById('expCat').value;
    const chips  = document.querySelectorAll('#splitAmong .check-chip.selected input');
    const splitAmong = Array.from(chips).map(c => c.value);

    if (!desc || !amount || !paidBy || !splitAmong.length) {
      alert('Please fill all fields and select at least one person to split with!');
      return;
    }

    expenses.push({ id: Date.now(), desc, amount, paidBy, cat, splitAmong });
    document.getElementById('expDesc').value = '';
    document.getElementById('expAmount').value = '';
    renderAll();
  }

  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    renderAll();
  }

  // ── Render ────────────────────────────────────────────────
  function renderAll() {
    renderExpenses();
    renderBalances();
    renderSettle();
  }

  function renderExpenses() {
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    document.getElementById('statTotal').textContent = '₹' + total.toLocaleString();
    document.getElementById('statCount').textContent = expenses.length;
    const perPerson = friends.length ? (total / friends.length) : 0;
    document.getElementById('statPer').textContent = '₹' + perPerson.toFixed(0);

    const el = document.getElementById('expensesList');
    if (!expenses.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">🧾</div>No expenses yet!</div>';
      return;
    }
    el.innerHTML = [...expenses].reverse().map(e => {
      const fi = friends.indexOf(e.paidBy);
      const [bg] = getColor(fi >= 0 ? fi : 0);
      return `<div class="expense-item">
        <div class="exp-icon ${CAT_CLASS[e.cat]}">${CAT_ICONS[e.cat]}</div>
        <div class="exp-info">
          <div class="exp-name">${e.desc}</div>
          <div class="exp-meta">Paid by <span style="color:${bg};font-weight:600">${e.paidBy}</span> · Split among ${e.splitAmong.join(', ')}</div>
        </div>
        <div class="exp-amount">₹${e.amount.toLocaleString()}</div>
        <button class="exp-del" onclick="deleteExpense(${e.id})">✕</button>
      </div>`;
    }).join('');
  }

  function computeBalances() {
    const bal = {};
    friends.forEach(f => bal[f] = 0);
    expenses.forEach(e => {
      const share = e.amount / e.splitAmong.length;
      bal[e.paidBy] = (bal[e.paidBy] || 0) + e.amount;
      e.splitAmong.forEach(f => { bal[f] = (bal[f] || 0) - share; });
    });
    return bal;
  }

  function renderBalances() {
    const bal = computeBalances();
    const el = document.getElementById('balancesList');
    if (!friends.length || !expenses.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">⚖️</div>Add expenses to see balances.</div>';
      return;
    }
    const maxAbs = Math.max(...Object.values(bal).map(Math.abs), 1);
    el.innerHTML = friends.map((f, i) => {
      const v = bal[f] || 0;
      const [bg] = getColor(i);
      const pct = Math.abs(v) / maxAbs * 100;
      const color = v > 0 ? 'var(--accent3)' : v < 0 ? 'var(--danger)' : 'var(--muted)';
      const label = v > 0 ? `gets back ₹${v.toFixed(0)}` : v < 0 ? `owes ₹${Math.abs(v).toFixed(0)}` : 'settled ✓';
      return `<div class="balance-item">
        <div class="balance-header">
          <span><span style="color:${bg};font-weight:700">${f}</span> <span style="color:var(--muted);font-size:0.82rem">${label}</span></span>
          <span style="color:${color};font-family:'Syne',sans-serif;font-weight:700">${v > 0 ? '+' : ''}₹${v.toFixed(0)}</span>
        </div>
        <div class="balance-bar-bg">
          <div class="balance-bar-fill" style="width:${pct}%;background:${color};"></div>
        </div>
      </div>`;
    }).join('');
  }

  function renderSettle() {
    const bal = computeBalances();
    const el = document.getElementById('settleList');

    // Minimum cash flow algorithm
    const pos = [], neg = [];
    Object.entries(bal).forEach(([f, v]) => {
      if (v > 0.01) pos.push([f, v]);
      else if (v < -0.01) neg.push([f, -v]);
    });

    if (!pos.length && !neg.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Everyone is settled up!</div>';
      return;
    }

    const transactions = [];
    let i = 0, j = 0;
    const posC = pos.map(x=>[...x]), negC = neg.map(x=>[...x]);
    while (i < posC.length && j < negC.length) {
      const amt = Math.min(posC[i][1], negC[j][1]);
      transactions.push({ from: negC[j][0], to: posC[i][0], amt });
      posC[i][1] -= amt;
      negC[j][1] -= amt;
      if (posC[i][1] < 0.01) i++;
      if (negC[j][1] < 0.01) j++;
    }

    el.innerHTML = transactions.map(t => {
      const fi = friends.indexOf(t.from), ti = friends.indexOf(t.to);
      const [bgF] = getColor(fi >= 0 ? fi : 0);
      const [bgT] = getColor(ti >= 0 ? ti : 0);
      return `<div class="settlement-item">
        <div class="s-avatar" style="background:${bgF}22;color:${bgF}">${t.from[0]}</div>
        <div class="s-text"><span style="color:${bgF}">${t.from}</span> pays <span style="color:${bgT}">${t.to}</span></div>
        <div class="s-arrow">→</div>
        <div class="s-amount">₹${t.amt.toFixed(0)}</div>
        <div class="s-avatar" style="background:${bgT}22;color:${bgT}">${t.to[0]}</div>
      </div>`;
    }).join('');
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t,i) => {
      const names = ['expenses','balances','settle'];
      t.classList.toggle('active', names[i] === name);
    });
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
  }

  function resetAll() {
    if (!confirm('Reset everything?')) return;
    friends = []; expenses = [];
    renderFriends(); updateSelects(); renderAll();
  }

  // Seed demo data
  ['Arshia', 'Rahul', 'Priya', 'Karan'].forEach(f => { friends.push(f); });
  renderFriends(); updateSelects();
  expenses.push({ id: 1, desc: 'Dhaba dinner', amount: 800, paidBy: 'Arshia', cat: 'food', splitAmong: ['Arshia','Rahul','Priya','Karan'] });
  expenses.push({ id: 2, desc: 'Uber to mall', amount: 240, paidBy: 'Rahul', cat: 'travel', splitAmong: ['Rahul','Priya','Karan'] });
  expenses.push({ id: 3, desc: 'Movie tickets', amount: 600, paidBy: 'Priya', cat: 'fun', splitAmong: ['Arshia','Rahul','Priya','Karan'] });
  renderAll();
</script>
</body>
</html>
